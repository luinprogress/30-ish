<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30-ish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#1F2224;--sage:#68747A;--bg:#F7F7F5;--ink:#1F2224;--acc:#D9DEE0;--card:#FFFFFF;--line:#D9DEE0;--mut:#68747A;--onpri:#FFFFFF;--hi:#1F2224;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F2224;--ink:#F7F7F5;--card:#2A2E31;--line:#3B4247;--mut:#9AA5AB;--pri:#68747A;--acc:#3B4247;--hi:#D9DEE0}}
:root[data-theme="dark"]{--bg:#1F2224;--ink:#F7F7F5;--card:#2A2E31;--line:#3B4247;--mut:#9AA5AB;--pri:#68747A;--acc:#3B4247;--hi:#D9DEE0}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans TC",system-ui,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}h2{font-size:17px;margin:0 0 10px;font-weight:700}
b,.b{font-weight:700}
.view{display:none}.view.on{display:block}
.hero{background:var(--pri);color:var(--onpri);border-radius:18px;padding:22px 20px;margin-bottom:14px;cursor:pointer}
.hero p{font-size:19px;font-weight:700;margin:0 0 6px;line-height:1.55}.hero small{opacity:.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;font:inherit;color:var(--ink);cursor:pointer}.st.on{background:var(--acc);box-shadow:inset 0 0 0 2px var(--hi)}.btn:disabled{opacity:.35;cursor:default}
.st b{display:block;font-size:30px;line-height:1.2;color:var(--hi)}.st span{font-size:13px}.st i{display:block;font-size:12px;color:var(--mut);font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.wk{display:flex;justify-content:space-between;margin-bottom:10px}
.d{width:40px;text-align:center;font-size:12px;color:var(--mut)}
.d u{display:block;width:34px;height:34px;margin:0 auto 2px;border-radius:50%;border:1.5px solid var(--line);text-decoration:none;line-height:31px;font-size:15px;color:var(--ink)}
.d.ok u,.cd.ok u{background:var(--pri);border-color:var(--pri);color:var(--onpri);font-weight:700}.d.td u,.cd.td u{border-color:var(--hi);border-width:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;text-align:center}.cal>span{font-size:12px}.cd{position:relative}.cd u{display:block;width:34px;height:34px;margin:0 auto;border-radius:50%;border:1.5px solid transparent;text-decoration:none;line-height:31px;font-size:14px}.cd sup{position:absolute;top:-6px;left:calc(50% + 10px);font-size:10px;font-weight:700;color:var(--hi)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:12px 18px;font:700 16px "Noto Sans TC",sans-serif;cursor:pointer;min-height:46px}
.btn.wide{width:100%;margin-top:12px}.btn.sec{background:transparent;color:var(--hi);border:1.5px solid var(--sage)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}.btn.dng{background:transparent;color:#a4483c;border:1.5px solid #d9aaa2}
input,select,textarea{width:100%;font:400 16px "Noto Sans TC",sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sage);outline-offset:1px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 14px;font:400 14px "Noto Sans TC",sans-serif;cursor:pointer}.chip.on{background:var(--acc);border-color:var(--sage);font-weight:700;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fx{flex:none}
.menu .top{display:flex;justify-content:space-between;gap:8px;align-items:start}.menu .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;background:var(--acc);color:var(--ink);border-radius:10px;padding:0 10px;font-size:12px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:12px 4px;font:500 15px "Noto Sans TC",sans-serif;color:var(--mut);cursor:pointer}nav button.on{color:var(--hi);font-weight:700;box-shadow:inset 0 3px var(--hi)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}.ov.on{display:block}
.ov>div{max-width:640px;margin:0 auto}
.fr{display:grid;grid-template-columns:1fr 70px 70px 36px;gap:6px;margin-bottom:6px;align-items:center}.fr input{padding:8px}
.fh{font-size:12px;color:var(--mut)}.xb{background:none;border:0;font-size:20px;color:#a4483c;cursor:pointer}
.tm{text-align:center;min-height:90vh;display:flex;flex-direction:column;justify-content:center;gap:10px}
.big{font-size:clamp(76px,26vw,132px);font-weight:700;line-height:1;color:var(--hi)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--hi);width:0;transition:width .3s}
.ov.rest{background:var(--acc)}.ov.rest *{color:var(--ink)}.ov.rest .big{color:var(--ink)}.ov.rest .bar{background:rgba(128,128,128,.25)}.ov.rest .bar i{background:var(--ink)}.ov.rest .chip{background:transparent}.ov.rest .chip.on{background:var(--card)}.nx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:18px}
.tm .chips{justify-content:center}.tm h2{font-size:26px}
.lg{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.lg:last-child{border:0}.pb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}.pb i{display:block;height:100%;background:var(--sage)}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 16px}.brand b{font-size:26px;line-height:1.1;display:block}.brand small{color:var(--mut);font-size:13px}.dg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}.dg.on{display:flex}.dg>div{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:380px;width:100%}
.lk{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}.lg{align-items:center;gap:8px}.dg>div{max-height:90vh;overflow:auto}.sf label{display:block;margin-top:12px;font-size:14px;color:var(--mut)}
.ex{padding:8px 0;border-top:1px solid var(--line);border-radius:6px}.r1{display:flex;gap:4px;align-items:center}.r1 input{flex:1;min-width:0}.r2{display:flex;gap:10px;margin:6px 0 0 32px}.r2 label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);flex:1}.r2 input{width:100%;min-width:0;padding:8px}
.hd{touch-action:none;cursor:grab;background:none;border:0;font-size:22px;color:var(--mut);width:28px;padding:0;user-select:none;-webkit-user-select:none}.xb{padding:6px 8px}.xb[data-cp]{color:var(--mut)}
.ex.drag{opacity:.45;background:var(--acc)}.ex-t{box-shadow:0 -2px 0 var(--hi)}.ex-b{box-shadow:0 2px 0 var(--hi)}.sec-over{outline:2px dashed var(--sage);outline-offset:2px}
.empty{text-align:center;color:var(--mut);padding:24px 0}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<main>
<section class="view on" id="v-home"></section>
<section class="view" id="v-menus"></section>
<section class="view" id="v-goal"></section>
</main>
<nav><button data-v="home" class="on">主頁</button><button data-v="menus">菜單</button><button data-v="goal">目標與備份</button></nav>
<div class="dg" id="dg"></div>
<div class="ov" id="ov-form"><div id="form"></div></div>
<div class="ov" id="ov-timer"><div id="timer"></div></div>

<script>
const K='wuxiong-workout-v1',PH=[['warm','暖身',5],['main','主訓練',20],['cool','收操',5]];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const Q={
 start:['先動起來，剩下的身體會幫你。','今天只要開始，就已經贏過昨天的猶豫。','30 分鐘，給自己一個交代。','不用完美，只要出現。'],
 mid:['你正在把運動變成習慣，這很了不起。','一次一次累積，身體都記得。','穩穩地做，比用力地做更久。','今天的你，比想像中更有力量。'],
 reach:['本週目標達成！你說到做到。','這就是自律的樣子，太棒了！','你已經成為會持續運動的人了。'],
 early:['有動就很好！你已經比沒開始的自己更棒了。','動了就算數，不用完美。','願意開始，就是最難的那一步。','能動多少算多少，身體都記得。'],
 done:['完成了！你剛剛把承諾兌現給自己。','辛苦了，這 30 分鐘全部都算數。','身體謝謝你，明天也一起加油。','又一次，你做到了。']};
function dlg(msg,ok,cancel){return new Promise(r=>{$('#dg').innerHTML=`<div role="dialog"><p style="margin:0 0 16px;font-size:17px;line-height:1.6">${msg}</p><div class="row">${cancel?`<button class="btn sec" id="dgn">${cancel}</button>`:''}<button class="btn" id="dgy">${ok||'好'}</button></div></div>`;$('#dg').classList.add('on');const c=v=>{$('#dg').classList.remove('on');r(v)};$('#dgy').onclick=()=>c(true);if(cancel)$('#dgn').onclick=()=>c(false)})}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function seed(){return{goal:3,logs:[],menus:[{id:uid(),name:"全身功能性訓練（初階）",tag:"全身",sec:{"warm":[{"n":"娃娃蹲","w":45,"r":15},{"n":"世界最好的伸展+胸椎活動","w":45,"r":15},{"n":"左右交替側蹲","w":45,"r":15},{"n":"抱膝上提單腿屈髖","w":45,"r":15},{"n":"平板跨步","w":30,"r":30}],"main":[{"n":"深蹲","w":45,"r":15},{"n":"寬距深蹲","w":45,"r":15},{"n":"螃蟹蹲🦀","w":45,"r":15},{"n":"提踵深蹲","w":45,"r":15},{"n":"弓步交替蹲","w":45,"r":15},{"n":"平板撐","w":45,"r":15},{"n":"跪姿伏地挺身","w":45,"r":15},{"n":"俯臥W字","w":45,"r":15},{"n":"捲腹","w":45,"r":15},{"n":"反向平板","w":45,"r":15},{"n":"深蹲","w":45,"r":15},{"n":"寬距深蹲","w":45,"r":15},{"n":"螃蟹蹲🦀","w":45,"r":15},{"n":"提踵深蹲","w":45,"r":15},{"n":"弓步交替蹲","w":45,"r":15},{"n":"平板撐","w":45,"r":15},{"n":"跪姿伏地挺身","w":45,"r":15},{"n":"俯臥W字","w":45,"r":15},{"n":"捲腹","w":45,"r":15},{"n":"反向平板","w":45,"r":15}],"cool":[{"n":"上犬式","w":30,"r":0},{"n":"下犬式","w":30,"r":0},{"n":"弓步腿前側伸展","w":30,"r":0},{"n":"俯身腿後側伸展","w":30,"r":0},{"n":"弓步腿前側伸展","w":30,"r":0},{"n":"俯身腿後側伸展","w":30,"r":0},{"n":"鴿式（右）","w":30,"r":0},{"n":"鴿式（左）","w":30,"r":0},{"n":"束腳式","w":30,"r":0},{"n":"嬰兒式","w":30,"r":0}]}}]}}
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.menus))return d}catch(e){}return seed()}
let S=load();const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const secTot=l=>l.reduce((a,e)=>a+(+e.w||0)+(+e.r||0),0),menuTot=m=>PH.reduce((a,[k])=>a+secTot(m.sec[k]),0);
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function monday(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function counts(){const m=monday().getTime(),n=new Date();return{w:S.logs.filter(l=>l.ts>=m).length,m:S.logs.filter(l=>{const d=new Date(l.ts);return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()}).length,t:S.logs.length}}
let quote='',selMenu='',qs='',qt='',rng='w',mOff=0;
function newQuote(){const c=counts();quote=pick(c.w>=S.goal?Q.reach:c.w==0?Q.start:Q.mid)}
const WD=[...'一二三四五六日'];
function statsH(){const c=counts();return [['w',c.w,'本週','目標 '+S.goal+' 次'],['m',c.m,'本月',''],['t',c.t,'總次數','']].map(([r,v,l,x])=>`<button class="st${rng==r?' on':''}" data-r="${r}" aria-pressed="${rng==r}"><b>${v}</b><span>${l}</span>${x?`<i>${x}</i>`:''}</button>`).join('')}
function panelW(){const mon=monday(),days=new Set(S.logs.map(l=>dk(l.ts))),td=dk(Date.now()),end=new Date(mon);end.setDate(end.getDate()+6);
 const wk=WD.map((t,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);const k=dk(d);return`<div class="d${days.has(k)?' ok':''}${k==td?' td':''}"><u>${d.getDate()}</u>${t}</div>`}).join('');
 return`<h2>本週　${mon.getMonth()+1}/${mon.getDate()} – ${end.getMonth()+1}/${end.getDate()}</h2><div class="wk">${wk}</div><p class="mut" style="margin:0">已完成 ${counts().w} 次・目標 ${S.goal} 次</p>`}
function panelM(){const n=new Date(),b=new Date(n.getFullYear(),n.getMonth()+mOff,1),y=b.getFullYear(),mo=b.getMonth(),dim=new Date(y,mo+1,0).getDate(),lead=(b.getDay()+6)%7,td=dk(Date.now()),cnt={};
 S.logs.forEach(l=>{const d=new Date(l.ts);if(d.getFullYear()==y&&d.getMonth()==mo)cnt[d.getDate()]=(cnt[d.getDate()]||0)+1});
 const tot=Object.values(cnt).reduce((a,x)=>a+x,0);let cells='';for(let i=0;i<lead;i++)cells+='<i></i>';
 for(let d=1;d<=dim;d++)cells+=`<div class="cd${cnt[d]?' ok':''}${y+'-'+(mo+1)+'-'+d==td?' td':''}"><u>${d}</u>${cnt[d]>1?'<sup>×'+cnt[d]+'</sup>':''}</div>`;
 return`<div class="row" style="margin-bottom:10px"><button class="btn sec sm fx" data-mo="-1" aria-label="上個月">‹</button><h2 style="margin:0;text-align:center">${y} 年 ${mo+1} 月</h2><button class="btn sec sm fx" data-mo="1" aria-label="下個月"${mOff>=0?' disabled':''}>›</button></div><div class="cal">${WD.map(x=>`<span class="mut">${x}</span>`).join('')}${cells}</div><p class="mut" style="margin:10px 0 0;text-align:center">運動 ${Object.keys(cnt).length} 天・共 ${tot} 次</p>`}
function panelT(){if(!S.logs.length)return'<div class="empty">完成第一次運動後，這裡會顯示每個月的次數。</div>';
 const m={};S.logs.forEach(l=>{const d=new Date(l.ts),k=d.getFullYear()*12+d.getMonth();m[k]=(m[k]||0)+1});
 const n=new Date(),cur=n.getFullYear()*12+n.getMonth(),first=Math.min(...Object.keys(m).map(Number)),tgt=S.goal*4;let rows='';
 for(let k=cur;k>=Math.max(first,cur-11);k--){const c=m[k]||0;rows+=`<div style="margin-bottom:12px"><div class="lg" style="border:0;padding:0"><span>${Math.floor(k/12)} 年 ${k%12+1} 月</span><span><b>${c}</b> 次${c>=tgt?' 🎉':''}</span></div><div class="pb" style="margin:4px 0 0"><i style="width:${Math.min(100,Math.round(c/tgt*100))}%"></i></div></div>`}
 return`<h2>每月運動次數</h2>${rows}<p class="mut" style="margin:0">進度條滿格 = 每週 ${S.goal} 次 × 4 週 = ${tgt} 次</p>`}
const panel=()=>rng=='w'?panelW():rng=='m'?panelM():panelT();
function home(){
 if(!quote)newQuote();const c=counts(),mon=monday(),days=new Set(S.logs.map(l=>dk(l.ts))),td=dk(Date.now());
 if(!S.menus.find(m=>m.id==selMenu))selMenu=S.menus[0]?.id||'';
 const m=S.menus.find(m=>m.id==selMenu);
 $('#v-home').innerHTML=`<div class="brand"><svg width="48" height="48" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="var(--pri)"/><text x="22" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" font-family="Noto Sans TC,sans-serif">30</text><path d="M10 34q4.2-6 8.4 0t8.4 0t8.4 0" stroke="#D9DEE0" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg><div><b>30-ish</b><small>差不多 30 分鐘，動就對了</small></div></div>
 <div class="hero" id="hero" role="button" tabindex="0"><p>${esc(quote)}</p><small>點一下換一句</small></div>
 <div class="stats" id="stats">${statsH()}</div><div class="card" id="panel">${panel()}</div>
 <div class="card">
 ${S.menus.length?`<h2>今天做哪一份</h2><select id="pick">${S.menus.map(x=>`<option value="${x.id}"${x.id==selMenu?' selected':''}>${esc(x.name)}</option>`).join('')}</select>
 <p class="mut" style="margin:8px 0 0">${m?PH.map(([k,n])=>n+' '+Math.round(secTot(m.sec[k])/60)+' 分').join('　'):''}</p>
 <button class="btn wide" id="go">開始運動</button>`:`<div class="empty">還沒有菜單，先到「菜單」新增一份吧。</div>`}</div>`}
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
function shareMenu(m){copyOut(`【30-ish 菜單】${m.name}（約 ${Math.round(menuTot(m)/60)} 分鐘）\n在 30-ish 的「菜單」頁按「匯入」，貼上整段文字即可。\n30ISH1:${enc({v:1,name:m.name,tag:m.tag||'',sec:m.sec})}`,'「'+esc(m.name)+'」的分享文字')}
async function copyOut(txt,label){let ok=false;try{await navigator.clipboard.writeText(txt);ok=true}catch(e){}
 if(ok)return dlg('已複製'+label+'！直接貼給朋友就可以了。');
 $('#dg').innerHTML=`<div role="dialog"><p id="cpm" style="margin:0 0 10px">無法自動複製，請長按下方文字全選後複製：</p><textarea id="cpx" rows="6" readonly>${esc(txt)}</textarea><button class="btn wide" id="dgy">完成</button></div>`;$('#dg').classList.add('on');$('#dgy').onclick=()=>$('#dg').classList.remove('on');
 const t=$('#cpx');t.focus();t.select();try{if(document.execCommand('copy'))$('#cpm').textContent='已複製'+label+'！直接貼給朋友就可以了。'}catch(e){}}
function parseMenu(txt){const i=txt.indexOf('30ISH1:');if(i<0)return'找不到菜單代碼，請確認有貼上完整的分享文字。';let o;
 try{o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(i+7).replace(/[^A-Za-z0-9+/=]/g,'')))))}catch(e){return'菜單代碼無法讀取，可能少貼了一部分，請重新複製完整文字。'}
 if(!o||typeof o.name!='string'||!o.sec)return'菜單內容格式不正確。';
 const num=v=>Math.min(3600,Math.max(0,Math.round(+v)||0)),sec={};
 for(const[k]of PH){const a=Array.isArray(o.sec[k])?o.sec[k]:[];sec[k]=a.slice(0,30).map(e=>({n:String((e&&e.n)||'').slice(0,40),w:num(e&&e.w),r:num(e&&e.r)})).filter(e=>e.n)}

async function doImport(txt){let d;try{d=JSON.parse(txt);if(!Array.isArray(d.menus)||!Array.isArray(d.logs))throw 0}catch(e){return dlg('備份內容格式不正確，請確認是完整的備份文字或檔案。')}
 if(!await dlg('匯入會取代目前所有菜單與紀錄，確定嗎？','匯入','取消'))return;S={goal:Math.min(7,Math.max(1,+d.goal||3)),menus:d.menus,logs:d.logs};save();quote='';await dlg('匯入完成');go('home')}
let DG=null;const clr=()=>document.querySelectorAll('.ex-t,.ex-b,.sec-over').forEach(x=>x.classList.remove('ex-t','ex-b','sec-over'));
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.hd');if(!h||!D)return;e.preventDefault();const row=h.closest('.ex');DG={p:row.dataset.p,i:+row.dataset.i,row,dst:null};row.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!DG)return;e.preventDefault();clr();const el=document.elementFromPoint(e.clientX,e.clientY),ex=el&&el.closest('.ex'),sec=el&&el.closest('[data-sec]');DG.dst=null;
 if(ex&&ex!=DG.row){const r=ex.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;ex.classList.add(after?'ex-b':'ex-t');DG.dst={p:ex.dataset.p,i:+ex.dataset.i+(after?1:0)}}
 else if(!ex&&sec){sec.classList.add('sec-over');DG.dst={p:sec.dataset.sec,i:D.sec[sec.dataset.sec].length}}
 const sc=$('#ov-form');if(e.clientY<90)sc.scrollTop-=12;else if(e.clientY>innerHeight-90)sc.scrollTop+=12});
const dgEnd=()=>{if(!DG)return;const g=DG;DG=null;clr();if(g.dst){const it=D.sec[g.p].splice(g.i,1)[0];let di=g.dst.i;if(g.dst.p==g.p&&g.i<di)di--;D.sec[g.dst.p].splice(di,0,it)}renderForm()};
document.addEventListener('pointerup',dgEnd);document.addEventListener('pointercancel',dgEnd);
home();
</script>
</body></html>
